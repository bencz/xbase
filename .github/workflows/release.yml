# The Windows package of a GitHub release: when a release is published, xbc is built with MinGW-w64 (MSYS2's UCRT64
# GCC, linked statically) and the runtime and the libraries with llvm-mingw's clang, whose toolchain the package carries
# (toolchain/: clang, lld, MinGW-w64's C runtime for UCRT; XB_BUNDLE_TOOLCHAIN), so that xbc compiles and links a
# program on a machine with nothing else installed. The build is installed into the package's folders (xbc/bin,
# include, libs, toolchain, docs), tried on programs built from the package alone (tests/package, and xbc run with no
# compiler on the path), zipped and attached to the release. Run by hand (workflow_dispatch), it does the same and keeps
# the zip as the run's artifact.
#
# LLVM is never built here: xbc links MSYS2's LLVM packages (pinned by file, since its repository moves on), zlib and
# zstd statically; llvm-mingw is its release named below, whose download is cached. xbc.exe is checked to import
# system DLLs only, and the package's programs to run outside MSYS2, as a user's machine has them.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  MSYS2_LLVM: 23.1.5-1
  LLVM_MINGW: 20261117
  TAG: ${{ github.event.release.tag_name || 'manual' }}

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: LLVM (pinned)
        shell: msys2 {0}
        run: |
          repo=https://repo.msys2.org/mingw/ucrt64
          pacman -U --noconfirm "$repo/mingw-w64-ucrt-x86_64-llvm-libs-$MSYS2_LLVM-any.pkg.tar.zst" \
                                "$repo/mingw-w64-ucrt-x86_64-llvm-tools-$MSYS2_LLVM-any.pkg.tar.zst" \
                                "$repo/mingw-w64-ucrt-x86_64-llvm-$MSYS2_LLVM-any.pkg.tar.zst"
          llvm-config --version

      - name: llvm-mingw (cached)
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: C:\llvm-mingw-${{ env.LLVM_MINGW }}-ucrt-x86_64
          key: llvm-mingw-${{ env.LLVM_MINGW }}-ucrt-x86_64

      - name: llvm-mingw (download)
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $name = "llvm-mingw-$env:LLVM_MINGW-ucrt-x86_64"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW/$name.zip"
          curl.exe -sSfL -o "$env:RUNNER_TEMP\llvm-mingw.zip" $url
          7z x "$env:RUNNER_TEMP\llvm-mingw.zip" -o"C:\" | Out-Null
          if (-not (Test-Path "C:\$name\bin\x86_64-w64-mingw32-clang.exe")) { throw "no clang in $name" }

      - name: llvm-mingw (save the download)
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\llvm-mingw-${{ env.LLVM_MINGW }}-ucrt-x86_64
          key: llvm-mingw-${{ env.LLVM_MINGW }}-ucrt-x86_64

      # xbc with MSYS2's GCC, which built the LLVM libraries it links; the runtime and the libraries with the clang of
      # the toolchain the package carries, which programs then link with.
      - name: Build
        shell: msys2 {0}
        run: |
          toolchain=C:/llvm-mingw-$LLVM_MINGW-ucrt-x86_64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXB_LLVM_STATIC=ON -DXB_SOURCE_INCLUDE=OFF \
                -DBUILD_TESTING=OFF -DCMAKE_EXE_LINKER_FLAGS=-static -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_C_COMPILER=$toolchain/bin/x86_64-w64-mingw32-clang.exe -DXB_BUNDLE_TOOLCHAIN=$toolchain
          cmake --build build --parallel
          cmake --install build --prefix pkg/xbc

      # xbc.exe must need no DLL of MSYS2's: only Windows' own (its C runtime, UCRT, included).
      - name: xbc's DLLs
        shell: msys2 {0}
        run: |
          objdump -p pkg/xbc/bin/xbc.exe | sed -n 's/.*DLL Name: //p' | tee dlls.txt
          system='kernel32|user32|advapi32|shell32|ole32|oleaut32|ws2_32|ntdll|psapi|shlwapi|version|bcrypt|crypt32'
          if grep -viE "^($system|dbghelp|ucrtbase|msvcrt|api-ms-win-.*)\.dll$" dlls.txt; then
            echo "xbc.exe needs a DLL that Windows does not have"; exit 1
          fi

      - name: Try the package
        shell: msys2 {0}
        run: |
          cmake -S tests/package -B pkgtest -G Ninja "-DXBASE_ROOT=$PWD/pkg/xbc" \
                "-DCMAKE_C_COMPILER=$PWD/pkg/xbc/toolchain/bin/x86_64-w64-mingw32-clang.exe"
          cmake --build pkgtest
          ctest --test-dir pkgtest --output-on-failure

      # With no compiler on the path, as on a machine with nothing but the package: xbc compiles and links with the
      # toolchain the package carries.
      - name: A program from the package alone
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $xbc = "$PWD\pkg\xbc\bin\xbc.exe"
          & $xbc --version
          New-Item -ItemType Directory -Force -Path alone | Out-Null
          Set-Content alone\hello.prg "PROCEDURE Main()`r`n   ? 'hello from', Upper( 'xbase' )`r`nRETURN"
          & $xbc alone\hello.prg -o alone\hello.exe
          $out = & .\alone\hello.exe | Out-String
          if ($out -notmatch 'hello from XBASE') { throw "hello.exe printed: $out" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path pkg/xbc -DestinationPath "xbase-$env:TAG-windows-x64.zip"

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release upload $env:TAG "xbase-$env:TAG-windows-x64.zip" --clobber

      - name: Keep as an artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: xbase-windows-x64
          path: xbase-*-windows-x64.zip
